name: B2B stock reservation expiry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: b2b-stock-reservation-expiry
  cancel-in-progress: false

jobs:
  expire-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expire due B2B stock reservations
        env:
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_TARGET_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::Configure CRON_TARGET_URL and CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_TARGET_URL%/}/api/cron/b2b-stock-reservations"
