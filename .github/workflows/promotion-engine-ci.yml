name: Promotion Engine CI

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  push:
    branches: [feat/promotion-engine-omnichannel]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ecommerce_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - name: Build application
        run: npm run build:ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ecommerce_ci
          JWT_SECRET: ci-build-secret
          FRONTEND_URL: http://localhost:3000
