name: Regenerate npm security lockfile

on:
  push:
    branches:
      - feat/senior-commerce-experience
    paths:
      - "frontend/package.json"

permissions:
  contents: write

concurrency:
  group: dependency-lock-security-update
  cancel-in-progress: false

jobs:
  lockfile:
    name: Resolve patched dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from the patched dependency manifest
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): regenerate security-patched npm lockfile"
          git push
