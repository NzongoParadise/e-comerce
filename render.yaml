services:
  - type: web
    name: techglobal-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_INSECURE_AUTH
        value: "false"
      - key: JWKS_URI
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APPLE_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_REGISTER_URL
        sync: false
